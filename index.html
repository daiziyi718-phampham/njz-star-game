<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NJZ Star Maze</title>

  <style>
    @font-face {
      font-family: "Fusion Pixel SC";
      src: url("assets/fonts/fusion-pixel-12px-sc.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      background: #06000f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }

    .game-wrap {
      position: relative;
      width: 648px;
      height: 648px;
      flex: 0 0 auto;
    }

    canvas {
      display: block;
      border: 4px solid white;
      image-rendering: pixelated;
      box-shadow:
        0 0 18px #ff5cf4,
        0 0 36px #8b5cff;
    }

    .home-button {
      position: absolute;
      top: 12px;
      right: 12px;
      display: none;
      width: 42px;
      height: 42px;
      border: 2px solid white;
      background: rgba(28, 0, 48, 0.84);
      cursor: pointer;
      box-shadow:
        0 0 10px #ff5cf4,
        inset 0 0 8px rgba(255, 92, 244, 0.4);
      image-rendering: pixelated;
    }

    .home-button:hover {
      background: rgba(255, 92, 244, 0.5);
      box-shadow:
        0 0 14px white,
        0 0 18px #ff5cf4;
    }

    .home-button::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 6px;
      width: 4px;
      height: 4px;
      background: transparent;
      box-shadow:
        12px 0 #1a0030,
        16px 0 #1a0030,
        8px 4px #1a0030,
        12px 4px white,
        16px 4px white,
        20px 4px #1a0030,
        4px 8px #1a0030,
        8px 8px white,
        12px 8px white,
        16px 8px white,
        20px 8px white,
        24px 8px #1a0030,
        0 12px #1a0030,
        4px 12px white,
        8px 12px white,
        12px 12px white,
        16px 12px white,
        20px 12px white,
        24px 12px white,
        28px 12px #1a0030,
        4px 16px #1a0030,
        8px 16px white,
        12px 16px white,
        16px 16px white,
        20px 16px white,
        24px 16px #1a0030,
        4px 20px #1a0030,
        8px 20px white,
        12px 20px #1a0030,
        16px 20px #1a0030,
        20px 20px white,
        24px 20px #1a0030,
        4px 24px #1a0030,
        8px 24px white,
        12px 24px #1a0030,
        16px 24px #1a0030,
        20px 24px white,
        24px 24px #1a0030,
        4px 28px #1a0030,
        8px 28px #1a0030,
        12px 28px #1a0030,
        16px 28px #1a0030,
        20px 28px #1a0030,
        24px 28px #1a0030;
      filter: drop-shadow(0 0 5px white);
    }
  </style>
</head>

<body>
  <div class="game-wrap">
    <canvas id="game" width="640" height="640"></canvas>
    <button class="home-button" id="homeButton" aria-label="Pause"></button>
  </div>

  <script src="levels.js"></script>
  <script src="character-stats.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const homeButton = document.getElementById("homeButton");
    const levels = window.LEVELS;
    const characterStats = window.CHARACTER_STATS;
    const PIXEL_UI_FONT = '"Fusion Pixel SC", monospace';

    const TILE_SIZE = 40;
    const GRID_COLS = canvas.width / TILE_SIZE;
    const GRID_ROWS = canvas.height / TILE_SIZE;
    const WALL = 1;
    const PATH = 0;

    // 只影响碰撞，不影响墙体视觉绘制。
    const WALL_COLLISION_PADDING = 4;
    const PLAYER_HITBOX_PADDING = 4;
    const ENEMY_HITBOX_PADDING = 3;

    const LASER_COOLDOWN = 600;
    const LASER_DURATION = 10;
    const PIG_RESPAWN_TIME = 240;
    const PIG_RESPAWN_WARNING_TIME = 120;
    const SPLIT_CHILD_SIZE_SCALE = 0.65;
    const CHASE_DETECTION_RANGE = 240;
    const CHASE_DURATION = 45;
    const CHASE_COOLDOWN = 90;
    const CHASE_SPEED_MULTIPLIER = 1.3;
    const EXTREME_CHASE_SPEED_MULTIPLIER = 1.1;
    const PORTAL_REENTRY_COOLDOWN_FRAMES = 4;
    const DEBUG_MODE = false;
    const UNLOCKED_LEVEL_STORAGE_KEY = "newjeansGameUnlockedLevel";
    const ENEMY_SPEED_VALUES = {
      slow: 1.5,
      normal: 2,
      fast: 2.5,
      extreme: 2.8
    };
    const MAZE_DIFFICULTY_CONFIGS = {
      easy: { wallChance: 0.18, blockCount: 12 },
      "easy-medium": { wallChance: 0.21, blockCount: 15 },
      medium: { wallChance: 0.25, blockCount: 18 },
      "medium-complex": { wallChance: 0.28, blockCount: 22 },
      complex: { wallChance: 0.3, blockCount: 24 },
      "complex-plus": { wallChance: 0.32, blockCount: 26 },
      "final-complex": { wallChance: 0.34, blockCount: 28 }
    };

    const player = {
      x: TILE_SIZE + 4,
      y: TILE_SIZE + 4,
      startX: TILE_SIZE + 4,
      startY: TILE_SIZE + 4,
      size: 32,
      baseSpeed: 4,
      speed: 4,
      livesBonus: 0,
      shieldCharges: 0,
      laserCooldownMultiplier: 1,
      laserKillGlobalStunFrames: 0,
      starMagnetRange: 0,
      laserRangeMultiplier: 1,
      respawnInvincibilityMultiplier: 1
    };

        const pigHome = {
      spawnTiles: [
        { col: 7, row: 7 },
        { col: 8, row: 7 },
        { col: 7, row: 8 },
        { col: 8, row: 8 }
      ],
      exitTile: { col: 8, row: 9 },
      protectedTiles: [
        { col: 6, row: 6 },
        { col: 7, row: 6 },
        { col: 8, row: 6 },
        { col: 9, row: 6 },

        { col: 6, row: 7 },
        { col: 7, row: 7 },
        { col: 8, row: 7 },
        { col: 9, row: 7 },

        { col: 6, row: 8 },
        { col: 7, row: 8 },
        { col: 8, row: 8 },
        { col: 9, row: 8 },

        { col: 6, row: 9 },
        { col: 7, row: 9 },
        { col: 8, row: 9 },
        { col: 9, row: 9 },

        { col: 8, row: 10 }
      ]
    };

    let currentFrame = 0;
    let frameTimer = 0;
    let score = 0;
    let lives = 3;
    let invincibleTimer = 0;
    let gameState = "start";
    let stars = [];
    let enemies = [];
    let pendingEnemySpawns = [];
    let lasers = [];
    let maze = [];
    let portals = [];
    let portalExitLock = null;
    let portalCooldown = 0;
    let currentLevelIndex = 0;
    let selectedDifficulty = 0;
    let selectedStartOption = 0;
    let selectedLevelOption = 0;
    let debugLevelSelectMode = false;
    let selectedPauseOption = 0;
    let selectedCharacterIndex = 0;
    let previewCharacterIndex = 0;
    let laserCooldown = 0;
    let globalEnemyStunTimer = 0;
    let laserShotsRemaining = 0;
    let remainingTimeSeconds = null;
    let lastCountdownTimestamp = null;
    let facingDirection = { dx: 1, dy: 0 };
    let hardRulesShown = false;
    let levelIntroNextState = "playing";
    let unlockedLevel = loadUnlockedLevel();

    const difficulties = [
      { name: "EASY", stars: 10, enemies: 1, wallChance: 0.18, blockCount: 12 },
      { name: "NORMAL", stars: 18, enemies: 3, wallChance: 0.25, blockCount: 18 },
      { name: "HARD", stars: 28, enemies: 5, wallChance: 0.32, blockCount: 26 }
    ];

    const pauseOptions = [
      "Continue Game",
      "Back to Main Menu"
    ];

    const startOptions = [
      { label: "开始冒险", action: "startAdventure" },
      { label: "选择角色", action: "characterSelect" }
    ];

    const characterImages = [
      "assets/characters/character-1.png",
      "assets/characters/character-2.png",
      "assets/characters/character-3.png",
      "assets/characters/character-4.png",
      "assets/characters/character-5.png"
    ].map(src => {
      const image = new Image();
      image.src = src;
      return image;
    });

    const keys = {};

    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "Escape", " "].includes(e.key)) {
        e.preventDefault();
      }

      keys[e.key] = true;

      if (gameState === "playing" && !e.repeat) {
        if (e.key === "ArrowUp") facingDirection = { dx: 0, dy: -1 };
        if (e.key === "ArrowDown") facingDirection = { dx: 0, dy: 1 };
        if (e.key === "ArrowLeft") facingDirection = { dx: -1, dy: 0 };
        if (e.key === "ArrowRight") facingDirection = { dx: 1, dy: 0 };
      }

      if (gameState === "start" && !e.repeat) {
        if (e.key === "ArrowUp") {
          selectedStartOption =
            (selectedStartOption - 1 + startOptions.length) %
            startOptions.length;
        }

        if (e.key === "ArrowDown") {
          selectedStartOption =
            (selectedStartOption + 1) %
            startOptions.length;
        }

        if (e.key === "Enter") {
          const selectedOption = startOptions[selectedStartOption];

          if (selectedOption.action === "startAdventure") {
            selectedLevelOption = 0;
            debugLevelSelectMode = false;
            gameState = "levelSelect";
          } else if (selectedOption.action === "characterSelect") {
            previewCharacterIndex = selectedCharacterIndex;
            gameState = "characterSelect";
          }
        }
      } else if (gameState === "levelSelect" && !e.repeat) {
        if (DEBUG_MODE && isDebugLevelShortcutPressed()) {
          debugLevelSelectMode = true;
          return;
        }

        if (e.key === "ArrowLeft") {
          selectedLevelOption =
            (selectedLevelOption - 1 + levels.length) %
            levels.length;
        }

        if (e.key === "ArrowRight") {
          selectedLevelOption =
            (selectedLevelOption + 1) %
            levels.length;
        }

        if (e.key === "ArrowUp") {
          selectedLevelOption =
            (selectedLevelOption - 5 + levels.length) %
            levels.length;
        }

        if (e.key === "ArrowDown") {
          selectedLevelOption =
            (selectedLevelOption + 5) %
            levels.length;
        }

        if (
          e.key === "Enter" &&
          (
            debugLevelSelectMode ||
            isLevelUnlocked(selectedLevelOption)
          )
        ) {
          currentLevelIndex = selectedLevelOption;
          hardRulesShown = false;
          startGame();
        }

        if (e.key === "Escape") {
          debugLevelSelectMode = false;
          gameState = "start";
        }
      } else if (gameState === "characterSelect" && !e.repeat) {
        if (e.key === "ArrowLeft") {
          previewCharacterIndex = (previewCharacterIndex - 1 + characterImages.length) % characterImages.length;
        }

        if (e.key === "ArrowRight") {
          previewCharacterIndex = (previewCharacterIndex + 1) % characterImages.length;
        }

        if (e.key === "Enter") {
          selectedCharacterIndex = previewCharacterIndex;
          gameState = "start";
        }

        if (e.key === "Escape") {
          previewCharacterIndex = selectedCharacterIndex;
          gameState = "start";
        }
      } else if (gameState === "hardRules" && e.key === " " && !e.repeat) {
        gameState = "playing";
        hardRulesShown = true;
        clearArrowKeys();
      } else if (gameState === "levelIntro" && e.key === "Enter" && !e.repeat) {
        gameState = levelIntroNextState;
        clearArrowKeys();
      } else if (gameState === "playing" && e.key === "Enter" && !e.repeat) {
        pauseGame();
      } else if (gameState === "playing" && e.key === " " && !e.repeat) {
        fireLaser();
      } else if (gameState === "paused" && !e.repeat) {
        if (e.key === "ArrowUp") {
          selectedPauseOption =
            (selectedPauseOption - 1 + pauseOptions.length) % pauseOptions.length;
        }

        if (e.key === "ArrowDown") {
          selectedPauseOption = (selectedPauseOption + 1) % pauseOptions.length;
        }

        if (e.key === "Enter") {
          confirmPauseOption();
        }
      } else if (gameState === "levelComplete" && e.key === "Enter" && !e.repeat) {
        currentLevelIndex++;
        startGame();
      } else if ((gameState === "win" || gameState === "gameOver") && e.key === "Enter") {
        startGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    homeButton.addEventListener("click", () => {
      if (gameState === "playing") {
        pauseGame();
      }
    });

    canvas.addEventListener("click", (e) => {
      if (gameState !== "paused") return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      pauseOptions.forEach((option, index) => {
        const optionX = canvas.width / 2 - 150;
        const optionY = 300 + index * 54 - 22;
        const optionWidth = 300;
        const optionHeight = 42;

        if (
          mouseX >= optionX &&
          mouseX <= optionX + optionWidth &&
          mouseY >= optionY &&
          mouseY <= optionY + optionHeight
        ) {
          selectedPauseOption = index;
          confirmPauseOption();
        }
      });
    });

    function isHardMode() {
      return difficulties[selectedDifficulty].name === "HARD";
    }

    function canCurrentLevelUseLaser() {
      const laserLimit = levels[currentLevelIndex]?.laserLimit;

      return (
        laserLimit === "unlimited" ||
        (
          typeof laserLimit === "number" &&
          laserShotsRemaining > 0
        )
      );
    }

    function getCurrentLevelLaserCooldownFrames() {
      const cooldownSeconds = levels[currentLevelIndex]?.laserCooldown;
      const baseCooldownFrames =
        typeof cooldownSeconds === "number" && cooldownSeconds >= 0
          ? cooldownSeconds * 60
          : LASER_COOLDOWN;

      return Math.round(
        baseCooldownFrames * player.laserCooldownMultiplier
      );
    }

    function loadUnlockedLevel() {
      try {
        const storedValue = Number(
          localStorage.getItem(UNLOCKED_LEVEL_STORAGE_KEY)
        );

        if (!Number.isInteger(storedValue)) {
          return 1;
        }

        return Math.min(
          levels.length,
          Math.max(1, storedValue)
        );
      } catch (error) {
        return 1;
      }
    }

    function saveUnlockedLevel() {
      try {
        localStorage.setItem(
          UNLOCKED_LEVEL_STORAGE_KEY,
          String(unlockedLevel)
        );
      } catch (error) {
        // localStorage 不可用时保留当前会话内的解锁进度。
      }
    }

    function unlockNextLevel() {
      if (debugLevelSelectMode) return;
      if (currentLevelIndex >= levels.length - 1) return;

      const nextLevelNumber = currentLevelIndex + 2;

      if (nextLevelNumber > unlockedLevel) {
        unlockedLevel = nextLevelNumber;
        saveUnlockedLevel();
      }
    }

    function pauseGame() {
      gameState = "paused";
      lastCountdownTimestamp = null;
      selectedPauseOption = 0;
      clearArrowKeys();
    }

    function resumeGame() {
      gameState = "playing";
      clearArrowKeys();
    }

    function backToMainMenu() {
      gameState = "start";
      hardRulesShown = false;
      clearArrowKeys();
    }

    function confirmPauseOption() {
      if (selectedPauseOption === 0) {
        resumeGame();
      } else {
        backToMainMenu();
      }
    }

    function updateButtons() {
      homeButton.style.display = gameState === "playing" ? "block" : "none";
    }

    function makeEmptyMaze() {
      const grid = [];

      for (let row = 0; row < GRID_ROWS; row++) {
        grid[row] = [];

        for (let col = 0; col < GRID_COLS; col++) {
          grid[row][col] =
            row === 0 || col === 0 || row === GRID_ROWS - 1 || col === GRID_COLS - 1
              ? WALL
              : PATH;
        }
      }

      return grid;
    }

    function copyMaze(source) {
      return source.map(row => row.slice());
    }

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = list[i];
        list[i] = list[j];
        list[j] = temp;
      }

      return list;
    }

    function isReservedTile(col, row) {
      const reserved = [
        { col: 1, row: 1 },
        { col: 2, row: 1 },
        { col: 1, row: 2 },
        { col: 2, row: 2 },
        { col: 13, row: 13 },
        { col: 14, row: 13 },
        { col: 13, row: 14 },
        { col: 14, row: 14 }
      ];

      return reserved.some(tile => tile.col === col && tile.row === row);
    }

    function tileNeighbors(col, row) {
      return [
        { col: col, row: row - 1 },
        { col: col, row: row + 1 },
        { col: col - 1, row: row },
        { col: col + 1, row: row }
      ];
    }

    function countPathNeighbors(grid, col, row) {
      return tileNeighbors(col, row).filter(tile => (
        tile.col >= 0 &&
        tile.col < GRID_COLS &&
        tile.row >= 0 &&
        tile.row < GRID_ROWS &&
        grid[tile.row][tile.col] === PATH
      )).length;
    }

    function getPathTiles(grid) {
      const tiles = [];

      for (let row = 1; row < GRID_ROWS - 1; row++) {
        for (let col = 1; col < GRID_COLS - 1; col++) {
          if (grid[row][col] === PATH) {
            tiles.push({ col, row });
          }
        }
      }

      return tiles;
    }

    function isMazeConnected(grid) {
      const paths = getPathTiles(grid);
      if (paths.length === 0) return false;

      const start = paths[0];
      const visited = new Set();
      const queue = [start];

      visited.add(start.col + "," + start.row);

      while (queue.length > 0) {
        const current = queue.shift();

        tileNeighbors(current.col, current.row).forEach(next => {
          const key = next.col + "," + next.row;

          if (
            next.col > 0 &&
            next.col < GRID_COLS - 1 &&
            next.row > 0 &&
            next.row < GRID_ROWS - 1 &&
            grid[next.row][next.col] === PATH &&
            !visited.has(key)
          ) {
            visited.add(key);
            queue.push(next);
          }
        });
      }

      return visited.size === paths.length;
    }

    function repairDeadEnds(grid) {
      let changed = true;
      let guard = 0;

      while (changed && guard < 300) {
        changed = false;
        guard++;

        for (let row = 1; row < GRID_ROWS - 1; row++) {
          for (let col = 1; col < GRID_COLS - 1; col++) {
            if (grid[row][col] !== PATH) continue;

            if (countPathNeighbors(grid, col, row) < 2) {
              const wallNeighbors = shuffle(tileNeighbors(col, row).filter(tile => (
                tile.col > 0 &&
                tile.col < GRID_COLS - 1 &&
                tile.row > 0 &&
                tile.row < GRID_ROWS - 1 &&
                grid[tile.row][tile.col] === WALL &&
                !isReservedTile(tile.col, tile.row)
              )));

              if (wallNeighbors.length > 0) {
                const next = wallNeighbors[0];
                grid[next.row][next.col] = PATH;
                changed = true;
              }
            }
          }
        }
      }
    }

    function addWallIfSafe(grid, col, row) {
      if (isReservedTile(col, row)) return false;
      if (grid[row][col] === WALL) return false;

      const testGrid = copyMaze(grid);
      testGrid[row][col] = WALL;

      if (!isMazeConnected(testGrid)) return false;

      grid[row][col] = WALL;
      return true;
    }

    function getMazeDifficultyConfig(difficultyName) {
      return (
        MAZE_DIFFICULTY_CONFIGS[difficultyName] ??
        MAZE_DIFFICULTY_CONFIGS.easy
      );
    }

    function generateMaze(level) {
      const config = getMazeDifficultyConfig(
        level?.maze?.difficulty
      );
      const grid = makeEmptyMaze();

      for (let i = 0; i < config.blockCount; i++) {
        const horizontal = Math.random() > 0.5;
        const length = 1 + Math.floor(Math.random() * 3);
        const startCol = 2 + Math.floor(Math.random() * (GRID_COLS - 4));
        const startRow = 2 + Math.floor(Math.random() * (GRID_ROWS - 4));

        for (let offset = 0; offset < length; offset++) {
          const col = horizontal ? startCol + offset : startCol;
          const row = horizontal ? startRow : startRow + offset;

          if (col < GRID_COLS - 1 && row < GRID_ROWS - 1) {
            addWallIfSafe(grid, col, row);
          }
        }
      }

      for (let row = 1; row < GRID_ROWS - 1; row++) {
        for (let col = 1; col < GRID_COLS - 1; col++) {
          if (
            Math.random() < config.wallChance &&
            (col + row) % 2 === 0
          ) {
            addWallIfSafe(grid, col, row);
          }
        }
      }

      repairDeadEnds(grid);
      maze = grid;

      if (isHardMode()) {
        carvePigHome();
      }

      generatePortals(level);
    }
        function carvePigHome() {
      const wallTiles = [
        { col: 6, row: 6 },
        { col: 7, row: 6 },
        { col: 8, row: 6 },
        { col: 9, row: 6 },

        { col: 6, row: 7 },
        { col: 9, row: 7 },

        { col: 6, row: 8 },
        { col: 9, row: 8 },

        { col: 6, row: 9 },
        { col: 7, row: 9 },
        { col: 9, row: 9 }
      ];

      const pathTiles = [
        { col: 7, row: 7 },
        { col: 8, row: 7 },
        { col: 7, row: 8 },
        { col: 8, row: 8 },
        { col: 8, row: 9 },
        { col: 8, row: 10 }
      ];

      wallTiles.forEach(tile => {
        maze[tile.row][tile.col] = WALL;
      });

      pathTiles.forEach(tile => {
        maze[tile.row][tile.col] = PATH;
      });
    }

    function getHitbox(x, y, size, padding) {
      return {
        x: x + padding,
        y: y + padding,
        width: size - padding * 2,
        height: size - padding * 2
      };
    }

    function isRectOverlapping(rectA, rectB) {
      return (
        rectA.x < rectB.x + rectB.width &&
        rectA.x + rectA.width > rectB.x &&
        rectA.y < rectB.y + rectB.height &&
        rectA.y + rectA.height > rectB.y
      );
    }

    function rectTouchesWall(x, y, size, hitboxPadding) {
      const hitbox = getHitbox(x, y, size, hitboxPadding);

      const left = Math.floor(hitbox.x / TILE_SIZE);
      const right = Math.floor((hitbox.x + hitbox.width - 1) / TILE_SIZE);
      const top = Math.floor(hitbox.y / TILE_SIZE);
      const bottom = Math.floor((hitbox.y + hitbox.height - 1) / TILE_SIZE);

      for (let row = top; row <= bottom; row++) {
        for (let col = left; col <= right; col++) {
          if (
            row < 0 ||
            row >= GRID_ROWS ||
            col < 0 ||
            col >= GRID_COLS
          ) {
            return true;
          }

          if (maze[row][col] !== WALL) {
            continue;
          }

          const wallCollisionBox = {
            x: col * TILE_SIZE + WALL_COLLISION_PADDING,
            y: row * TILE_SIZE + WALL_COLLISION_PADDING,
            width: TILE_SIZE - WALL_COLLISION_PADDING * 2,
            height: TILE_SIZE - WALL_COLLISION_PADDING * 2
          };

          if (isRectOverlapping(hitbox, wallCollisionBox)) {
            return true;
          }
        }
      }

      return false;
    }

    function canEntityMoveTo(entity, newX, newY) {
      const hitboxPadding =
        entity === player
          ? PLAYER_HITBOX_PADDING
          : ENEMY_HITBOX_PADDING;

      return !rectTouchesWall(newX, newY, entity.size, hitboxPadding);
    }

    function canMoveTo(newX, newY) {
      return canEntityMoveTo(player, newX, newY);
    }

    function distance(x1, y1, x2, y2) {
      const dx = x1 - x2;
      const dy = y1 - y2;

      return Math.sqrt(dx * dx + dy * dy);
    }

    function tileCenter(col, row) {
      return {
        x: col * TILE_SIZE + TILE_SIZE / 2,
        y: row * TILE_SIZE + TILE_SIZE / 2
      };
    }

    function tileKey(col, row) {
      return col + "," + row;
    }

    function getPathDistances(startTile) {
      const distances = new Map([[tileKey(startTile.col, startTile.row), 0]]);
      const queue = [startTile];

      for (let index = 0; index < queue.length; index++) {
        const current = queue[index];
        const currentDistance = distances.get(tileKey(current.col, current.row));

        tileNeighbors(current.col, current.row).forEach(next => {
          const key = tileKey(next.col, next.row);
          if (
            next.col > 0 && next.col < GRID_COLS - 1 &&
            next.row > 0 && next.row < GRID_ROWS - 1 &&
            maze[next.row][next.col] === PATH &&
            !distances.has(key)
          ) {
            distances.set(key, currentDistance + 1);
            queue.push(next);
          }
        });
      }

      return distances;
    }

    function isPortalTile(col, row) {
      return portals.some(portal => portal.col === col && portal.row === row);
    }

    function getSpawnRouteProtectedTiles(startTile) {
      const protectedTiles = new Set([tileKey(startTile.col, startTile.row)]);
      const reachableCount = getPathDistances(startTile).size;

      getPathTiles(maze).forEach(blockedTile => {
        const blockedKey = tileKey(blockedTile.col, blockedTile.row);
        if (blockedKey === tileKey(startTile.col, startTile.row)) return;

        const visited = new Set([tileKey(startTile.col, startTile.row)]);
        const queue = [startTile];

        for (let index = 0; index < queue.length; index++) {
          const current = queue[index];
          tileNeighbors(current.col, current.row).forEach(next => {
            const key = tileKey(next.col, next.row);
            if (
              key !== blockedKey &&
              next.col > 0 && next.col < GRID_COLS - 1 &&
              next.row > 0 && next.row < GRID_ROWS - 1 &&
              maze[next.row][next.col] === PATH &&
              !visited.has(key)
            ) {
              visited.add(key);
              queue.push(next);
            }
          });
        }

        // 移除该格会切断出生点与其他道路，它就是唯一必经路线的一部分。
        if (visited.size < reachableCount - 1) protectedTiles.add(blockedKey);
      });

      return protectedTiles;
    }

    function findTeachingPortalPair(candidates, fromStart) {
      const nearCandidates = candidates.filter(tile => {
        const startDistance = fromStart.get(tileKey(tile.col, tile.row));
        return startDistance >= 2 && startDistance <= 5;
      });
      const farCandidates = candidates.filter(tile => (
        fromStart.get(tileKey(tile.col, tile.row)) >= 10
      ));
      let bestPair = null;
      let bestScore = -Infinity;

      for (const entrance of nearCandidates) {
        const fromEntrance = getPathDistances(entrance);

        for (const exit of farCandidates) {
          const routeDistance = fromEntrance.get(tileKey(exit.col, exit.row));
          if (routeDistance === undefined || routeDistance < 10) continue;

          const score =
            routeDistance * 3 +
            fromStart.get(tileKey(exit.col, exit.row)) -
            fromStart.get(tileKey(entrance.col, entrance.row));

          if (score > bestScore) {
            bestScore = score;
            bestPair = [entrance, exit];
          }
        }
      }

      return bestPair;
    }

    function findQuadrantPortalPairs(candidates) {
      const centerCol = GRID_COLS / 2;
      const centerRow = GRID_ROWS / 2;
      const quadrantMargin = 1;
      const minimumRouteDistance = 6;
      const quadrantConfigs = [
        {
          target: { col: 2, row: 2 },
          matches: tile =>
            tile.col < centerCol - quadrantMargin &&
            tile.row < centerRow - quadrantMargin
        },
        {
          target: { col: GRID_COLS - 3, row: GRID_ROWS - 3 },
          matches: tile =>
            tile.col > centerCol + quadrantMargin - 1 &&
            tile.row > centerRow + quadrantMargin - 1
        },
        {
          target: { col: GRID_COLS - 3, row: 2 },
          matches: tile =>
            tile.col > centerCol + quadrantMargin - 1 &&
            tile.row < centerRow - quadrantMargin
        },
        {
          target: { col: 2, row: GRID_ROWS - 3 },
          matches: tile =>
            tile.col < centerCol - quadrantMargin &&
            tile.row > centerRow + quadrantMargin - 1
        }
      ];
      const selected = [];

      for (const config of quadrantConfigs) {
        const quadrantCandidates = candidates
          .filter(config.matches)
          .sort((tileA, tileB) => {
            const distanceA =
              Math.abs(tileA.col - config.target.col) +
              Math.abs(tileA.row - config.target.row);
            const distanceB =
              Math.abs(tileB.col - config.target.col) +
              Math.abs(tileB.row - config.target.row);
            return distanceA - distanceB;
          });
        const selectedTile = quadrantCandidates.find(candidate => {
          const distances = getPathDistances(candidate);
          return selected.every(tile => (
            distances.get(tileKey(tile.col, tile.row)) >= minimumRouteDistance
          ));
        });

        if (!selectedTile) return null;
        selected.push(selectedTile);
      }

      return [
        [selected[0], selected[1]],
        [selected[2], selected[3]]
      ];
    }

    function generatePortals(level) {
      portals = [];
      portalExitLock = null;
      portalCooldown = 0;

      const features = level?.maze?.features ?? [];
      const pairCount = Math.max(0, Math.floor(level?.maze?.portalPairs ?? 0));
      if (!features.includes("portals") || pairCount === 0) return;

      const startTile = {
        col: Math.floor((player.startX + player.size / 2) / TILE_SIZE),
        row: Math.floor((player.startY + player.size / 2) / TILE_SIZE)
      };
      const fromStart = getPathDistances(startTile);
      const spawnRouteProtectedTiles = getSpawnRouteProtectedTiles(startTile);
      const validCandidates = getPathTiles(maze).filter(tile => {
        const startDistance = fromStart.get(tileKey(tile.col, tile.row));
        return (
          startDistance !== undefined &&
          countPathNeighbors(maze, tile.col, tile.row) >= 2 &&
          !isReservedTile(tile.col, tile.row) &&
          !spawnRouteProtectedTiles.has(tileKey(tile.col, tile.row)) &&
          !isPigHomeProtectedTile(tile.col, tile.row)
        );
      });
      const candidates = validCandidates.filter(tile => (
        fromStart.get(tileKey(tile.col, tile.row)) >= 5
      ));
      const used = new Set();
      let firstRandomPairId = 0;

      if (
        level?.maze?.portalLayout === "quadrants" &&
        pairCount === 2
      ) {
        const quadrantPairs = findQuadrantPortalPairs(validCandidates);

        if (quadrantPairs) {
          quadrantPairs.forEach((pair, pairId) => {
            pair.forEach((tile, endpoint) => {
              portals.push({ ...tile, pairId, endpoint });
            });
          });
        }

        return;
      }

      if (level?.maze?.portalLayout === "teaching") {
        const teachingPair = findTeachingPortalPair(validCandidates, fromStart);

        if (teachingPair) {
          teachingPair.forEach((tile, endpoint) => {
            used.add(tileKey(tile.col, tile.row));
            portals.push({ ...tile, pairId: 0, endpoint });
          });
          firstRandomPairId = 1;
        }
      }

      for (let pairId = firstRandomPairId; pairId < pairCount; pairId++) {
        let bestPair = null;
        let bestScore = -Infinity;

        for (const entrance of candidates) {
          if (used.has(tileKey(entrance.col, entrance.row))) continue;
          const fromEntrance = getPathDistances(entrance);

          for (const exit of candidates) {
            const exitKey = tileKey(exit.col, exit.row);
            if (exit === entrance || used.has(exitKey)) continue;
            const routeDistance = fromEntrance.get(exitKey);
            if (routeDistance === undefined || routeDistance < 8) continue;

            const startValue = Math.min(
              fromStart.get(tileKey(entrance.col, entrance.row)),
              fromStart.get(exitKey)
            );
            const score = routeDistance * 3 + startValue;
            if (score > bestScore) {
              bestScore = score;
              bestPair = [entrance, exit];
            }
          }
        }

        if (!bestPair) break;
        bestPair.forEach((tile, endpoint) => {
          used.add(tileKey(tile.col, tile.row));
          portals.push({ ...tile, pairId, endpoint });
        });
      }
    }

    function updatePlayerPortal() {
      if (portalCooldown > 0) portalCooldown--;

      const col = Math.floor((player.x + player.size / 2) / TILE_SIZE);
      const row = Math.floor((player.y + player.size / 2) / TILE_SIZE);
      const currentKey = tileKey(col, row);

      if (portalExitLock !== null) {
        if (currentKey !== portalExitLock && portalCooldown <= 0) {
          portalExitLock = null;
        }
        return;
      }
      if (portalCooldown > 0) return;

      const entrance = portals.find(portal => portal.col === col && portal.row === row);
      if (!entrance) return;
      const exit = portals.find(portal => (
        portal.pairId === entrance.pairId && portal.endpoint !== entrance.endpoint
      ));
      if (!exit) return;

      player.x = exit.col * TILE_SIZE + (TILE_SIZE - player.size) / 2;
      player.y = exit.row * TILE_SIZE + (TILE_SIZE - player.size) / 2;
      portalExitLock = tileKey(exit.col, exit.row);
      portalCooldown = PORTAL_REENTRY_COOLDOWN_FRAMES;
    }

    function randomPathTile(minDistanceFromStart, extraFilter = () => true) {
      const pathTiles = shuffle(getPathTiles(maze).filter(tile => {
        const center = tileCenter(tile.col, tile.row);
        const startCenterX = player.startX + player.size / 2;
        const startCenterY = player.startY + player.size / 2;

        return (
          distance(center.x, center.y, startCenterX, startCenterY) >= minDistanceFromStart &&
          extraFilter(tile)
        );
      }));

      return pathTiles[0] || { col: 1, row: 1 };
    }

    function pigHomeSpawnTile(index) {
      return pigHome.spawnTiles[index % pigHome.spawnTiles.length];
    }
    function isPigHomeProtectedTile(col, row) {
      if (!isHardMode()) return false;

      return pigHome.protectedTiles.some(tile => tile.col === col && tile.row === row);
    }

    function isNearPigHomeSpawn(centerX, centerY) {
      if (!isHardMode()) return false;

      return pigHome.spawnTiles.some(tile => {
        const center = tileCenter(tile.col, tile.row);
        return distance(centerX, centerY, center.x, center.y) < 70;
      });
    }

    function isTooCloseToOtherStars(x, y) {
      return stars.some(star => distance(x, y, star.x, star.y) < 34);
    }

    function isTooCloseToOtherEnemies(x, y) {
      return enemies.some(enemy => {
        const enemyCenterX = enemy.x + enemy.size / 2;
        const enemyCenterY = enemy.y + enemy.size / 2;

        return distance(x, y, enemyCenterX, enemyCenterY) < 70;
      });
    }
    function getReachableTiles() {
      const startCol = Math.floor((player.startX + player.size / 2) / TILE_SIZE);
      const startRow = Math.floor((player.startY + player.size / 2) / TILE_SIZE);
      const reachableTiles = [];
      const visited = new Set();
      const queue = [{ col: startCol, row: startRow }];

      visited.add(startCol + "," + startRow);

      while (queue.length > 0) {
        const current = queue.shift();

        if (
          current.col <= 0 ||
          current.col >= GRID_COLS - 1 ||
          current.row <= 0 ||
          current.row >= GRID_ROWS - 1 ||
          maze[current.row][current.col] !== PATH
        ) {
          continue;
        }

        reachableTiles.push(current);

        tileNeighbors(current.col, current.row).forEach(next => {
          const key = next.col + "," + next.row;

          if (
            next.col > 0 &&
            next.col < GRID_COLS - 1 &&
            next.row > 0 &&
            next.row < GRID_ROWS - 1 &&
            maze[next.row][next.col] === PATH &&
            !visited.has(key)
          ) {
            visited.add(key);
            queue.push(next);
          }
        });
      }

      return reachableTiles;
    }

    function getStarSpawnTiles() {
      const startCenterX = player.startX + player.size / 2;
      const startCenterY = player.startY + player.size / 2;

      return getReachableTiles().filter(tile => {
        const center = tileCenter(tile.col, tile.row);
        const farFromPlayerStart =
          distance(center.x, center.y, startCenterX, startCenterY) >= 110;

        const hasBreathingRoom =
          countPathNeighbors(maze, tile.col, tile.row) >= 2;

        return (
          farFromPlayerStart &&
          hasBreathingRoom &&
          !isPortalTile(tile.col, tile.row) &&
          !isPigHomeProtectedTile(tile.col, tile.row) &&
          !isNearPigHomeSpawn(center.x, center.y)
        );
      });
    }
        function generateStars(amount) {
      stars = [];

      const candidates = shuffle(getStarSpawnTiles());

      for (let i = 0; i < candidates.length && stars.length < amount; i++) {
        const tile = candidates[i];
        const center = tileCenter(tile.col, tile.row);

        if (!isTooCloseToOtherStars(center.x, center.y)) {
          stars.push({
            x: center.x,
            y: center.y,
            radius: 8,
            collected: false
          });
        }
      }

      return stars.length === amount;
    }

    function chooseEnemyDirection(enemy) {
      const directions = shuffle([
        { dx: 0, dy: -1 },
        { dx: 0, dy: 1 },
        { dx: -1, dy: 0 },
        { dx: 1, dy: 0 }
      ]);

      for (let i = 0; i < directions.length; i++) {
        const direction = directions[i];
        const nextX = enemy.x + direction.dx * enemy.speed;
        const nextY = enemy.y + direction.dy * enemy.speed;

        if (canEntityMoveTo(enemy, nextX, nextY)) {
          enemy.dx = direction.dx;
          enemy.dy = direction.dy;
          enemy.moveTimer = 25 + Math.floor(Math.random() * 65);
          return;
        }
      }

      enemy.dx = 0;
      enemy.dy = 0;
      enemy.moveTimer = 20;
    }

    function segmentIntersectsRect(x1, y1, x2, y2, left, top, right, bottom) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      let minTime = 0;
      let maxTime = 1;
      const edges = [
        { direction: -dx, distance: x1 - left },
        { direction: dx, distance: right - x1 },
        { direction: -dy, distance: y1 - top },
        { direction: dy, distance: bottom - y1 }
      ];

      for (const edge of edges) {
        if (edge.direction === 0) {
          if (edge.distance < 0) return false;
          continue;
        }

        const time = edge.distance / edge.direction;

        if (edge.direction < 0) {
          if (time > maxTime) return false;
          minTime = Math.max(minTime, time);
        } else {
          if (time < minTime) return false;
          maxTime = Math.min(maxTime, time);
        }
      }

      return true;
    }

    function isSightBlockedByWall(x1, y1, x2, y2) {
      const startCol = Math.max(0, Math.floor(Math.min(x1, x2) / TILE_SIZE));
      const endCol = Math.min(
        GRID_COLS - 1,
        Math.floor(Math.max(x1, x2) / TILE_SIZE)
      );
      const startRow = Math.max(0, Math.floor(Math.min(y1, y2) / TILE_SIZE));
      const endRow = Math.min(
        GRID_ROWS - 1,
        Math.floor(Math.max(y1, y2) / TILE_SIZE)
      );

      for (let row = startRow; row <= endRow; row++) {
        for (let col = startCol; col <= endCol; col++) {
          if (maze[row][col] !== WALL) continue;

          if (
            segmentIntersectsRect(
              x1,
              y1,
              x2,
              y2,
              col * TILE_SIZE,
              row * TILE_SIZE,
              (col + 1) * TILE_SIZE,
              (row + 1) * TILE_SIZE
            )
          ) {
            return true;
          }
        }
      }

      return false;
    }

    function canEnemySeePlayer(enemy) {
      const enemyCenterX = enemy.x + enemy.size / 2;
      const enemyCenterY = enemy.y + enemy.size / 2;
      const playerCenterX = player.x + player.size / 2;
      const playerCenterY = player.y + player.size / 2;
      const sightDistance = distance(
        enemyCenterX,
        enemyCenterY,
        playerCenterX,
        playerCenterY
      );

      if (sightDistance >= CHASE_DETECTION_RANGE) return false;

      return !isSightBlockedByWall(
        enemyCenterX,
        enemyCenterY,
        playerCenterX,
        playerCenterY
      );
    }

    function chooseChaseDirection(enemy) {
      const enemyCenterX = enemy.x + enemy.size / 2;
      const enemyCenterY = enemy.y + enemy.size / 2;
      const playerCenterX = player.x + player.size / 2;
      const playerCenterY = player.y + player.size / 2;
      const deltaX = playerCenterX - enemyCenterX;
      const deltaY = playerCenterY - enemyCenterY;
      const horizontalDirection = { dx: Math.sign(deltaX), dy: 0 };
      const verticalDirection = { dx: 0, dy: Math.sign(deltaY) };
      const directions = Math.abs(deltaX) >= Math.abs(deltaY)
        ? [horizontalDirection, verticalDirection]
        : [verticalDirection, horizontalDirection];

      for (const direction of directions) {
        if (direction.dx === 0 && direction.dy === 0) continue;

        const nextX = enemy.x + direction.dx * enemy.speed;
        const nextY = enemy.y + direction.dy * enemy.speed;

        if (canEntityMoveTo(enemy, nextX, nextY)) {
          enemy.dx = direction.dx;
          enemy.dy = direction.dy;
          return;
        }
      }

      enemy.dx = 0;
      enemy.dy = 0;
    }

    function startEnemyChase(enemy) {
      const speedMultiplier =
        enemy.speedName === "extreme"
          ? EXTREME_CHASE_SPEED_MULTIPLIER
          : CHASE_SPEED_MULTIPLIER;

      enemy.behaviorState.mode = "chasing";
      enemy.behaviorState.chaseTimer = CHASE_DURATION;
      enemy.speed = enemy.baseSpeed * speedMultiplier;
      chooseChaseDirection(enemy);
    }

    function stopEnemyChase(enemy) {
      enemy.behaviorState.mode = "cooldown";
      enemy.behaviorState.chaseTimer = 0;
      enemy.behaviorState.cooldownTimer = CHASE_COOLDOWN;
      enemy.speed = enemy.baseSpeed;
      chooseEnemyDirection(enemy);
    }

    function updateChaseBehavior(enemy) {
      if (enemy.behaviorState.mode === "chasing") {
        enemy.behaviorState.chaseTimer--;

        if (enemy.behaviorState.chaseTimer <= 0) {
          stopEnemyChase(enemy);
          return false;
        }

        chooseChaseDirection(enemy);
        return true;
      }

      if (enemy.behaviorState.cooldownTimer > 0) {
        enemy.behaviorState.cooldownTimer--;

        if (enemy.behaviorState.cooldownTimer <= 0) {
          enemy.behaviorState.mode = "wander";
        }

        return false;
      }

      if (canEnemySeePlayer(enemy)) {
        startEnemyChase(enemy);
        return true;
      }

      return false;
    }

    function updateEnemyBehavior(enemy) {
      if (enemy.behavior === "chase") {
        return updateChaseBehavior(enemy);
      }

      return false;
    }

    function getEnemySpeed(speedName) {
      return (
        ENEMY_SPEED_VALUES[speedName] ??
        ENEMY_SPEED_VALUES.normal
      );
    }

    function buildEnemySpawnConfigs(enemyGroups) {
      const spawnConfigs = [];

      enemyGroups.forEach((group, groupIndex) => {
        for (let i = 0; i < group.count; i++) {
          spawnConfigs.push({
            groupIndex,
            group
          });
        }
      });

      return spawnConfigs;
    }

    function generateEnemies(enemySpawnConfigs) {
      enemies = [];
      let attempts = 0;

      while (
        enemies.length < enemySpawnConfigs.length &&
        attempts < 8000
      ) {
        const spawnConfig = enemySpawnConfigs[enemies.length];
        const sourceGroup = spawnConfig.group;
        const configuredType = sourceGroup.type ?? "normal";
        const type = configuredType === "accelerating" ? "chasing" : configuredType;
        const behavior = type === "chasing" ? "chase" : "wander";
        const configuredAbilities = Array.isArray(sourceGroup.abilities)
          ? [...sourceGroup.abilities]
          : [];
        const defaultAbilities =
          type === "respawning" || type === "chasing"
            ? ["respawn"]
            : [];
        const abilities = [...new Set([
          ...defaultAbilities,
          ...configuredAbilities
        ])];
        const baseSpeed =
          sourceGroup.baseSpeed ?? getEnemySpeed(sourceGroup.speed);
        const canRespawn =
          type !== "splitting" &&
          (sourceGroup.canRespawn ?? abilities.includes("respawn"));
        const size = 32;
        const tile = isHardMode()
          ? pigHomeSpawnTile(enemies.length)
          : randomPathTile(260, tile => !isPortalTile(tile.col, tile.row));
        const x = tile.col * TILE_SIZE + 4;
        const y = tile.row * TILE_SIZE + 4;

                const enemyPreview = {
          size
        };

        if (
          canEntityMoveTo(enemyPreview, x, y) &&
          (isHardMode() || !isTooCloseToOtherEnemies(x, y))
        ) {
          const enemy = {
            x,
            y,
            homeX: x,
            homeY: y,
            size,
            type,
            behavior,
            abilities,
            state: "active",
            baseSpeed,
            speed: baseSpeed,
            speedName: sourceGroup.speed,
            behaviorState: {
              mode: "wander",
              chaseTimer: 0,
              cooldownTimer: 0
            },
            canRespawn,
            generation: 0,
            canSplit: type === "splitting",
            sourceGroupIndex: spawnConfig.groupIndex,
            sourceGroup,
            dx: 0,
            dy: 0,
            moveTimer: 0,
            active: true,
            respawnTimer: 0,
            stunTimer: 0,
            floatPhase: Math.random() * Math.PI * 2
          };

          chooseEnemyDirection(enemy);
          enemies.push(enemy);
        }

        attempts++;
      }
    }

    function clearArrowKeys() {
      keys.ArrowUp = false;
      keys.ArrowDown = false;
      keys.ArrowLeft = false;
      keys.ArrowRight = false;
    }

    function resetPlayer() {
      player.x = player.startX;
      player.y = player.startY;
      portalExitLock = null;
      portalCooldown = 0;
      invincibleTimer = 150;
      clearArrowKeys();
    }

    function applyCharacterStats() {
      const stats = characterStats[selectedCharacterIndex] ?? characterStats[0];

      player.speed = player.baseSpeed * stats.speedMultiplier;
      player.livesBonus = stats.livesBonus;
      player.shieldCharges = stats.shieldCharges;
      player.laserCooldownMultiplier = stats.laserCooldownMultiplier;
      player.laserKillGlobalStunFrames = stats.laserKillGlobalStunFrames;
      player.starMagnetRange = stats.starMagnetRange;
      player.laserRangeMultiplier = stats.laserRangeMultiplier;
      player.respawnInvincibilityMultiplier =
        stats.respawnInvincibilityMultiplier;
    }

    function startGame() {
      const level = levels[currentLevelIndex];
      applyCharacterStats();
      const enemySpawnConfigs =
        buildEnemySpawnConfigs(level.enemyGroups);

      score = 0;
      lives = 3 + player.livesBonus;
      currentFrame = 0;
      frameTimer = 0;
      invincibleTimer = 0;
      laserCooldown = 0;
      globalEnemyStunTimer = 0;
      laserShotsRemaining =
        typeof level.laserLimit === "number"
          ? level.laserLimit
          : 0;
      remainingTimeSeconds =
        typeof level.timeLimitSeconds === "number" &&
        level.timeLimitSeconds > 0
          ? level.timeLimitSeconds
          : null;
      lastCountdownTimestamp = null;
      lasers = [];
      pendingEnemySpawns = [];
      facingDirection = { dx: 1, dy: 0 };
      player.x = player.startX;
      player.y = player.startY;
      portals = [];
      portalExitLock = null;
      portalCooldown = 0;
      clearArrowKeys();
            let starsGenerated = false;

      while (!starsGenerated) {
        generateMaze(level);
        const requiredPortalCount =
          (level.maze.features ?? []).includes("portals")
            ? Math.max(0, Math.floor(level.maze.portalPairs ?? 0)) * 2
            : 0;
        if (portals.length !== requiredPortalCount) continue;
        starsGenerated = generateStars(level.starCount);
      }

      generateEnemies(enemySpawnConfigs);

      levelIntroNextState =
        isHardMode() && !hardRulesShown
          ? "hardRules"
          : "playing";
      gameState = "levelIntro";
    }

    function isTouchingStar(star) {
      return (
        player.x < star.x + star.radius &&
        player.x + player.size > star.x - star.radius &&
        player.y < star.y + star.radius &&
        player.y + player.size > star.y - star.radius
      );
    }

    function isPathTile(col, row) {
      return (
        col >= 0 &&
        col < GRID_COLS &&
        row >= 0 &&
        row < GRID_ROWS &&
        maze[row][col] === PATH
      );
    }

    function canMagnetCollectStar(star) {
      if (player.starMagnetRange <= 0) return false;

      const playerCol = Math.floor(
        (player.x + player.size / 2) / TILE_SIZE
      );
      const playerRow = Math.floor(
        (player.y + player.size / 2) / TILE_SIZE
      );
      const starCol = Math.floor(star.x / TILE_SIZE);
      const starRow = Math.floor(star.y / TILE_SIZE);
      const colOffset = starCol - playerCol;
      const rowOffset = starRow - playerRow;

      if (
        (colOffset === 0 && rowOffset === 0) ||
        Math.abs(colOffset) > player.starMagnetRange ||
        Math.abs(rowOffset) > player.starMagnetRange ||
        !isPathTile(playerCol, playerRow) ||
        !isPathTile(starCol, starRow)
      ) {
        return false;
      }

      if (colOffset === 0 || rowOffset === 0) {
        return true;
      }

      const horizontalThenVertical =
        isPathTile(starCol, playerRow) &&
        isPathTile(starCol, starRow);
      const verticalThenHorizontal =
        isPathTile(playerCol, starRow) &&
        isPathTile(starCol, starRow);

      return horizontalThenVertical || verticalThenHorizontal;
    }

    function collectStars() {
      stars.forEach(star => {
        if (
          !star.collected &&
          (isTouchingStar(star) || canMagnetCollectStar(star))
        ) {
          star.collected = true;
          score++;
        }
      });

      if (stars.length > 0 && score >= stars.length) {
        unlockNextLevel();
        gameState =
          currentLevelIndex < levels.length - 1
            ? "levelComplete"
            : "win";
        clearArrowKeys();
      }
    }

    function updateCountdown(timestamp) {
      if (remainingTimeSeconds === null) return;

      if (lastCountdownTimestamp === null) {
        lastCountdownTimestamp = timestamp;
        return;
      }

      const elapsedSeconds =
        Math.max(0, timestamp - lastCountdownTimestamp) / 1000;
      lastCountdownTimestamp = timestamp;
      remainingTimeSeconds = Math.max(
        0,
        remainingTimeSeconds - elapsedSeconds
      );

      if (remainingTimeSeconds <= 0) {
        remainingTimeSeconds = 0;
        lastCountdownTimestamp = null;
        lives = 0;
        gameState = "gameOver";
        clearArrowKeys();
      }
    }

    function isPlayerTouchingEnemy(enemy) {
      if (!enemy.active) return false;

      return (
        player.x < enemy.x + enemy.size &&
        player.x + player.size > enemy.x &&
        player.y < enemy.y + enemy.size &&
        player.y + player.size > enemy.y
      );
    }

    function getLaserEnd(startX, startY, dx, dy) {
      let x = startX;
      let y = startY;

      while (
        x > 0 &&
        x < canvas.width &&
        y > 0 &&
        y < canvas.height &&
        !rectTouchesWall(x - 2, y - 2, 4)
      ) {
        x += dx * 8;
        y += dy * 8;
      }

      return { x, y };
    }

    function fireLaser() {
      if (!canCurrentLevelUseLaser() || laserCooldown > 0) return;

      const startX = player.x + player.size / 2;
      const startY = player.y + player.size / 2;
      const end = getLaserEnd(startX, startY, facingDirection.dx, facingDirection.dy);

      const laser = {
        x1: startX,
        y1: startY,
        x2: end.x,
        y2: end.y,
        dx: facingDirection.dx,
        dy: facingDirection.dy,
        timer: LASER_DURATION
      };

      lasers.push(laser);
      laserCooldown = getCurrentLevelLaserCooldownFrames();

      if (typeof levels[currentLevelIndex].laserLimit === "number") {
        laserShotsRemaining--;
      }

      hitEnemiesWithLaser(laser);
    }

    function laserTouchesEnemy(laser, enemy) {
      if (!enemy.active) return false;

      const padding = 8;

      if (laser.dx !== 0) {
        const minX = Math.min(laser.x1, laser.x2);
        const maxX = Math.max(laser.x1, laser.x2);

        return (
          enemy.x < maxX &&
          enemy.x + enemy.size > minX &&
          enemy.y < laser.y1 + padding &&
          enemy.y + enemy.size > laser.y1 - padding
        );
      }

      const minY = Math.min(laser.y1, laser.y2);
      const maxY = Math.max(laser.y1, laser.y2);

      return (
        enemy.y < maxY &&
        enemy.y + enemy.size > minY &&
        enemy.x < laser.x1 + padding &&
        enemy.x + enemy.size > laser.x1 - padding
      );
    }

    function hitEnemiesWithLaser(laser) {
      let killedAnyEnemy = false;

      enemies.forEach(enemy => {
        if (laserTouchesEnemy(laser, enemy)) {
          killedAnyEnemy = killEnemy(enemy, "laser") || killedAnyEnemy;
        }
      });

      if (killedAnyEnemy && player.laserKillGlobalStunFrames > 0) {
        triggerGlobalEnemyStun(player.laserKillGlobalStunFrames);
      }
    }

    function triggerGlobalEnemyStun(durationFrames) {
      globalEnemyStunTimer = durationFrames;

      enemies.forEach(enemy => {
        enemy.stunTimer = durationFrames;
      });
    }

    function isValidSplitChildPosition(size, x, y) {
      const preview = { size };
      const childRect = { x, y, width: size, height: size };
      const playerRect = {
        x: player.x,
        y: player.y,
        width: player.size,
        height: player.size
      };

      return (
        canEntityMoveTo(preview, x, y) &&
        !isRectOverlapping(childRect, playerRect)
      );
    }

    function findSplitChildPositions(parent, childSize) {
      const centerX = parent.x + parent.size / 2;
      const centerY = parent.y + parent.size / 2;
      const closeOffset = Math.max(5, childSize * 0.35);
      const wideOffset = childSize + 4;
      const offsets = [
        { x: -closeOffset, y: 0 },
        { x: closeOffset, y: 0 },
        { x: 0, y: -closeOffset },
        { x: 0, y: closeOffset },
        { x: -closeOffset, y: -closeOffset },
        { x: closeOffset, y: closeOffset },
        { x: -wideOffset, y: 0 },
        { x: wideOffset, y: 0 },
        { x: 0, y: -wideOffset },
        { x: 0, y: wideOffset }
      ];
      const candidates = offsets.map(offset => ({
        x: centerX + offset.x - childSize / 2,
        y: centerY + offset.y - childSize / 2
      })).filter(position =>
        isValidSplitChildPosition(childSize, position.x, position.y)
      );
      const positions = [];

      for (const candidate of candidates) {
        const candidateRect = {
          x: candidate.x,
          y: candidate.y,
          width: childSize,
          height: childSize
        };
        const overlapsChild = positions.some(position =>
          isRectOverlapping(candidateRect, {
            x: position.x,
            y: position.y,
            width: childSize,
            height: childSize
          })
        );

        if (!overlapsChild) positions.push(candidate);
        if (positions.length === 2) return positions;
      }

      for (const candidate of candidates) {
        const duplicatesChild = positions.some(position =>
          Math.abs(position.x - candidate.x) < 0.5 &&
          Math.abs(position.y - candidate.y) < 0.5
        );

        if (!duplicatesChild) positions.push(candidate);
        if (positions.length === 2) break;
      }

      return positions;
    }

    function createSplitChild(parent, position) {
      const size = parent.size * SPLIT_CHILD_SIZE_SCALE;
      const baseSpeed = ENEMY_SPEED_VALUES.normal;
      const enemy = {
        x: position.x,
        y: position.y,
        homeX: position.x,
        homeY: position.y,
        size,
        type: "split-child",
        behavior: "wander",
        abilities: [],
        state: "active",
        baseSpeed,
        speed: baseSpeed,
        speedName: "normal",
        behaviorState: {
          mode: "wander",
          chaseTimer: 0,
          cooldownTimer: 0
        },
        canRespawn: false,
        generation: 1,
        canSplit: false,
        sourceGroupIndex: parent.sourceGroupIndex,
        sourceGroup: parent.sourceGroup,
        dx: 0,
        dy: 0,
        moveTimer: 0,
        active: true,
        respawnTimer: 0,
        stunTimer: globalEnemyStunTimer,
        floatPhase: Math.random() * Math.PI * 2
      };

      chooseEnemyDirection(enemy);
      return enemy;
    }

    function queueSplitChildren(parent) {
      pendingEnemySpawns.push({ kind: "split", parent });
    }

    function flushEnemySpawnQueue() {
      const spawnRequests = pendingEnemySpawns;
      pendingEnemySpawns = [];

      spawnRequests.forEach(request => {
        if (request.kind !== "split") return;

        const childSize = request.parent.size * SPLIT_CHILD_SIZE_SCALE;
        const positions = findSplitChildPositions(request.parent, childSize);

        positions.forEach(position => {
          enemies.push(createSplitChild(request.parent, position));
        });
      });
    }

    function killEnemy(enemy, cause = "unknown") {
      if (!enemy.active) return false;

      enemy.active = false;
      enemy.state = enemy.canRespawn ? "respawning" : "dead";
      enemy.respawnTimer = enemy.canRespawn ? PIG_RESPAWN_TIME : 0;
      enemy.dx = 0;
      enemy.dy = 0;

      if (
        cause === "laser" &&
        enemy.type === "splitting" &&
        enemy.generation === 0 &&
        enemy.canSplit
      ) {
        queueSplitChildren(enemy);
      }

      return true;
    }

    function respawnEnemy(enemy) {
      enemy.x = enemy.homeX;
      enemy.y = enemy.homeY;
      enemy.active = true;
      enemy.state = "active";
      enemy.speed = enemy.baseSpeed;
      enemy.behaviorState.mode = "wander";
      enemy.behaviorState.chaseTimer = 0;
      enemy.behaviorState.cooldownTimer = 0;
      enemy.respawnTimer = 0;
      chooseEnemyDirection(enemy);
    }

    function updateLasers() {
      if (laserCooldown > 0) {
        laserCooldown--;
      }

      lasers.forEach(laser => {
        laser.timer--;
      });

      lasers = lasers.filter(laser => laser.timer > 0);
    }

    function updateEnemies() {
      if (globalEnemyStunTimer > 0) {
        globalEnemyStunTimer--;
      }

      enemies.forEach(enemy => {
        if (!enemy.active) {
          if (!enemy.canRespawn || enemy.state !== "respawning") {
            return;
          }

          enemy.respawnTimer--;

          if (enemy.respawnTimer <= 0) {
            respawnEnemy(enemy);
          }

          return;
        }

        if (enemy.stunTimer > 0) {
          enemy.stunTimer--;
          return;
        }

        const behaviorControlsDirection = updateEnemyBehavior(enemy);

        if (!behaviorControlsDirection) {
          enemy.moveTimer--;

          if (enemy.moveTimer <= 0) {
            chooseEnemyDirection(enemy);
          }
        }

        let nextX = enemy.x + enemy.dx * enemy.speed;
        let nextY = enemy.y + enemy.dy * enemy.speed;

        if (canEntityMoveTo(enemy, nextX, nextY)) {
          enemy.x = nextX;
          enemy.y = nextY;
        } else {
          if (behaviorControlsDirection) {
            chooseChaseDirection(enemy);
          } else {
            chooseEnemyDirection(enemy);
          }

          nextX = enemy.x + enemy.dx * enemy.speed;
          nextY = enemy.y + enemy.dy * enemy.speed;

          if (canEntityMoveTo(enemy, nextX, nextY)) {
            enemy.x = nextX;
            enemy.y = nextY;
          }
        }
      });
    }

    function checkEnemyCollision() {
      if (invincibleTimer > 0) {
        invincibleTimer--;
        return;
      }

      if (enemies.some(enemy => isPlayerTouchingEnemy(enemy))) {
        lives--;

        if (lives <= 0) {
          lives = 0;
          gameState = "gameOver";
          clearArrowKeys();
        } else {
          resetPlayer();
        }
      }
    }

    function drawStar(x, y, radius, sparkle) {
      ctx.save();

      ctx.shadowColor = "white";
      ctx.shadowBlur = 10 + sparkle * 10;
      ctx.fillStyle = "rgba(255, 255, 255, 0.96)";

      ctx.beginPath();

      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const pointRadius = i % 2 === 0 ? radius + sparkle * 2 : radius * 0.45;
        const px = x + Math.cos(angle) * pointRadius;
        const py = y + Math.sin(angle) * pointRadius;

        if (i === 0) {
          ctx.moveTo(px, py);
        } else {
          ctx.lineTo(px, py);
        }
      }

      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#11001f");
      gradient.addColorStop(0.5, "#24003d");
      gradient.addColorStop(1, "#080018");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.globalAlpha = 0.14;
      ctx.strokeStyle = "#ff7bff";
      ctx.lineWidth = 1;

      for (let x = 0; x <= canvas.width; x += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = 0; y <= canvas.height; y += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawMazeWalls() {
      for (let row = 0; row < GRID_ROWS; row++) {
        for (let col = 0; col < GRID_COLS; col++) {
          if (maze[row][col] !== WALL) continue;

          const x = col * TILE_SIZE;
          const y = row * TILE_SIZE;

          ctx.save();

          ctx.shadowColor = "#ff4df3";
          ctx.shadowBlur = 16;
          ctx.fillStyle = "#ff4df3";
          ctx.fillRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6);

          ctx.shadowColor = "#8b5cff";
          ctx.shadowBlur = 22;
          ctx.fillStyle = "#8b5cff";
          ctx.fillRect(x + 6, y + 6, TILE_SIZE - 12, TILE_SIZE - 12);

          ctx.shadowBlur = 0;
          ctx.fillStyle = "#ffd6ff";
          ctx.globalAlpha = 0.78;
          ctx.fillRect(x + 9, y + 9, TILE_SIZE - 18, 4);

          ctx.globalAlpha = 0.2;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x + 9, y + 9, 4, TILE_SIZE - 18);

          ctx.restore();
        }
      }
    }

    function drawPigHome() {
      // 猪猪之家由 HARD 模式迷宫墙体本身围成，这里不额外绘制装饰盒子。
    }

    function drawPortals() {
      const colors = ["#55f6ff", "#ff67d4", "#9cff57", "#ffcf5a"];
      const time = performance.now() / 500;
      const animationFrame = Math.floor(performance.now() / 160);
      const outerRing = [
        [-8, -16, 16, 4],
        [-12, -12, 4, 4], [8, -12, 4, 4],
        [-16, -8, 4, 16], [12, -8, 4, 16],
        [-12, 8, 4, 4], [8, 8, 4, 4],
        [-8, 12, 16, 4]
      ];
      const innerRing = [
        [-8, -12, 16, 4],
        [-12, -8, 4, 16], [8, -8, 4, 16],
        [-8, 8, 16, 4]
      ];
      const swirlFrames = [
        [[-4, -8], [0, -8], [4, -4], [4, 0], [0, 4], [-4, 4]],
        [[0, -8], [4, -8], [4, -4], [0, 0], [-4, 0], [-4, 4]],
        [[4, -8], [4, -4], [0, -4], [-4, 0], [-4, 4], [0, 4]]
      ];

      portals.forEach(portal => {
        const center = tileCenter(portal.col, portal.row);
        const color = colors[portal.pairId % colors.length];
        const frame = (animationFrame + portal.pairId + portal.endpoint) % swirlFrames.length;
        const pulse = 1 + Math.sin(time + portal.pairId) * 0.08;

        ctx.save();
        ctx.translate(Math.round(center.x), Math.round(center.y));
        ctx.scale(pulse, pulse);

        // Restore the original soft halo and curved energy traces behind the
        // pixel-built portal, while keeping its blocky structure on top.
        ctx.shadowColor = color;
        ctx.shadowBlur = 22;
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 11, -0.25, Math.PI * 1.15);
        ctx.stroke();
        ctx.globalAlpha = 0.65;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 6, Math.PI * 0.7, Math.PI * 2.05);
        ctx.stroke();

        // Dark, hard-edged opening with a sparse checker texture.
        ctx.globalAlpha = 0.72;
        ctx.fillStyle = "#080018";
        ctx.fillRect(-12, -12, 24, 24);
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = color;
        for (let y = -8; y <= 4; y += 4) {
          for (let x = -8; x <= 4; x += 4) {
            if (((x + y) / 4 + frame) % 2 === 0) ctx.fillRect(x, y, 4, 4);
          }
        }

        // Two square-pixel rings replace the former anti-aliased circles.
        ctx.globalAlpha = 0.42;
        outerRing.forEach(([x, y, width, height]) => ctx.fillRect(x, y, width, height));
        ctx.globalAlpha = 1;
        outerRing.forEach(([x, y, width, height]) => {
          ctx.fillRect(x + Math.sign(x), y + Math.sign(y), width, height);
        });
        ctx.globalAlpha = 0.62;
        innerRing.forEach(([x, y, width, height]) => ctx.fillRect(x, y, width, height));

        // The inner block spiral keeps its three-frame pixel animation.
        ctx.globalAlpha = 0.95;
        swirlFrames[frame].forEach(([x, y], index) => {
          ctx.globalAlpha = index < 2 ? 1 : 0.58;
          ctx.fillRect(x, y, 4, 4);
        });
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 4, 4);
        ctx.restore();
      });
    }

    function drawLaser(laser) {
      ctx.save();

      ctx.globalAlpha = Math.max(0.25, laser.timer / LASER_DURATION);
      ctx.lineCap = "square";

      ctx.shadowColor = "#6bdcff";
      ctx.shadowBlur = 22;
      ctx.strokeStyle = "#6c5cff";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(laser.x1, laser.y1);
      ctx.lineTo(laser.x2, laser.y2);
      ctx.stroke();

      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 14;
      ctx.strokeStyle = "#d9f8ff";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(laser.x1, laser.y1);
      ctx.lineTo(laser.x2, laser.y2);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(laser.x1, laser.y1);
      ctx.lineTo(laser.x2, laser.y2);
      ctx.stroke();

      ctx.restore();
    }

    function drawAlienPig(enemy) {
      const isRespawnWarning =
        !enemy.active &&
        enemy.state === "respawning" &&
        enemy.respawnTimer > 0 &&
        enemy.respawnTimer <= PIG_RESPAWN_WARNING_TIME;

      if (!enemy.active && !isRespawnWarning) return;

      const floatOffset = Math.sin(performance.now() / 180 + enemy.floatPhase) * 2;
      const renderX = isRespawnWarning ? enemy.homeX : enemy.x;
      const renderY = isRespawnWarning ? enemy.homeY : enemy.y;
      const warningAlpha = isRespawnWarning
        ? Math.floor(enemy.respawnTimer / 10) % 2 === 0
          ? 0.5
          : 0
        : 1;
      const isSplittingParent = enemy.type === "splitting";
      const isSplitChild = enemy.type === "split-child";
      const bodyColor = isSplittingParent
        ? "#ff9f43"
        : isSplitChild
          ? "#7deaff"
          : "#ff77e9";
      const accentColor = isSplittingParent
        ? "#d35400"
        : isSplitChild
          ? "#247ba0"
          : "#b967ff";
      const snoutColor = isSplittingParent
        ? "#ffd09b"
        : isSplitChild
          ? "#c9f7ff"
          : "#ffb3f6";

      ctx.save();
      ctx.globalAlpha = warningAlpha;
      ctx.translate(Math.round(renderX), Math.round(renderY + floatOffset));
      ctx.scale(enemy.size / 32, enemy.size / 32);

      ctx.shadowColor = bodyColor;
      ctx.shadowBlur = 16;

      ctx.fillStyle = bodyColor;
      ctx.fillRect(5, 9, 22, 18);
      ctx.fillRect(9, 5, 14, 6);
      ctx.fillRect(3, 15, 26, 14);

      ctx.fillStyle = accentColor;
      ctx.fillRect(1, 11, 5, 8);
      ctx.fillRect(26, 11, 5, 8);

      ctx.fillStyle = snoutColor;
      ctx.fillRect(11, 18, 10, 7);
      ctx.fillRect(9, 17, 14, 3);

      ctx.fillStyle = "#6d147c";
      ctx.fillRect(13, 20, 2, 2);
      ctx.fillRect(19, 20, 2, 2);

      ctx.fillStyle = "#f8e7ff";
      ctx.fillRect(8, 13, 5, 5);
      ctx.fillRect(21, 13, 5, 5);

      ctx.fillStyle = "#27113d";
      ctx.fillRect(10, 15, 2, 2);
      ctx.fillRect(23, 15, 2, 2);

      ctx.fillStyle = accentColor;
      ctx.fillRect(13, 1, 3, 6);
      ctx.fillRect(18, 1, 3, 6);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(12, 0, 5, 3);
      ctx.fillRect(17, 0, 5, 3);

      ctx.fillStyle = bodyColor;
      ctx.fillRect(6, 28, 5, 4);
      ctx.fillRect(15, 28, 5, 4);
      ctx.fillRect(24, 28, 5, 4);

      ctx.globalAlpha = warningAlpha * 0.72;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(9, 7, 14, 2);

      ctx.restore();
    }

    function update() {
      let nextX = player.x;
      let nextY = player.y;

      if (keys["ArrowUp"]) {
        nextY -= player.speed;
        facingDirection = { dx: 0, dy: -1 };
      }

      if (keys["ArrowDown"]) {
        nextY += player.speed;
        facingDirection = { dx: 0, dy: 1 };
      }

      if (keys["ArrowLeft"]) {
        nextX -= player.speed;
        facingDirection = { dx: -1, dy: 0 };
      }

      if (keys["ArrowRight"]) {
        nextX += player.speed;
        facingDirection = { dx: 1, dy: 0 };
      }

      const playerMoved = nextX !== player.x || nextY !== player.y;
      if (playerMoved && canMoveTo(nextX, nextY)) {
        player.x = nextX;
        player.y = nextY;
        updatePlayerPortal();
      }

      updateLasers();
      updateEnemies();
      collectStars();
      checkEnemyCollision();
      flushEnemySpawnQueue();

      frameTimer++;

      if (frameTimer > 10) {
        currentFrame++;
        frameTimer = 0;

        if (currentFrame > 3) {
          currentFrame = 0;
        }
      }
    }

    function drawHearts() {
      ctx.save();
      ctx.fillStyle = "#ff304f";
      ctx.shadowColor = "#ff304f";
      ctx.shadowBlur = 10;
      ctx.font = "24px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("♥".repeat(lives), 18, 42);
      ctx.restore();
    }

    function drawLaserHud() {
      const level = levels[currentLevelIndex];
      const laserLimit = level.laserLimit;

      if (laserLimit === null || laserLimit === undefined) return;

      const x = 18;
      const y = 72;
      const width = 118;
      const height = 12;
      const hasShots =
        laserLimit === "unlimited" ||
        laserShotsRemaining > 0;
      const ready = hasShots && laserCooldown <= 0;
      const cooldownFrames = getCurrentLevelLaserCooldownFrames();
      const progress =
        !hasShots
          ? 0
          : ready || cooldownFrames === 0
            ? 1
            : 1 - laserCooldown / cooldownFrames;
      const pulse = 0.72 + Math.sin(performance.now() / 130) * 0.28;
      const shotsLabel =
        laserLimit === "unlimited"
          ? "∞"
          : laserShotsRemaining;

      ctx.save();

      ctx.font = "14px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = ready ? "#dffbff" : "#a89bcf";
      ctx.shadowColor = ready ? "#7deaff" : "#41346d";
      ctx.shadowBlur = ready ? 12 * pulse : 5;
      ctx.fillText("LASER " + shotsLabel, x, y);

      ctx.fillStyle = "rgba(12, 10, 38, 0.9)";
      ctx.shadowBlur = 0;
      ctx.fillRect(x, y + 20, width, height);

      ctx.strokeStyle = ready ? "#dffbff" : "#665a91";
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 2, y + 18, width + 4, height + 4);

      ctx.shadowColor = ready ? "#7deaff" : "#342c66";
      ctx.shadowBlur = ready ? 14 * pulse : 4;
      ctx.fillStyle = ready ? "#dffbff" : "#4d4778";
      ctx.fillRect(x, y + 20, Math.max(0, width * progress), height);

      ctx.fillStyle = ready ? "#ffffff" : "#8f86bf";
      ctx.globalAlpha = ready ? 0.85 : 0.55;
      ctx.fillRect(x + 3, y + 23, Math.max(0, width * progress - 6), 2);

      if (!ready && laserCooldown > 0) {
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#c9c2ec";
        ctx.font = "13px monospace";
        ctx.fillText(Math.ceil(laserCooldown / 60) + "s", x + width + 10, y + 18);
      }

      ctx.restore();
    }

    function drawTimeHud() {
      if (remainingTimeSeconds === null) return;

      const displaySeconds = Math.ceil(remainingTimeSeconds);
      const isLowTime = remainingTimeSeconds <= 10;

      ctx.save();
      ctx.fillStyle = isLowTime ? "#ff5c7a" : "white";
      ctx.shadowColor = isLowTime ? "#ff304f" : "#7deaff";
      ctx.shadowBlur = isLowTime ? 14 : 8;
      ctx.font = "20px monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.fillText(
        "TIME: " + displaySeconds,
        canvas.width - 18,
        64
      );
      ctx.restore();
    }

    function drawHud() {
      ctx.save();
      ctx.fillStyle = "white";
      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 10;
      ctx.font = "22px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("Score: " + score, 18, 14);
      ctx.restore();

      drawHearts();
      drawLaserHud();
      drawTimeHud();
    }

    function drawStartScreen() {
      drawBackground();

      const time = performance.now() / 300;

      for (let i = 0; i < 24; i++) {
        const x = 55 + (i * 91) % 535;
        const y = 55 + (i * 149) % 535;
        const sparkle = (Math.sin(time + i) + 1) / 2;

        drawStar(x, y, 4 + (i % 3), sparkle);
      }

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "white";
      ctx.font = "52px " + PIXEL_UI_FONT;
      ctx.fillText("NJZ Star Maze", canvas.width / 2, 155);

      ctx.shadowColor = "#8b5cff";
      ctx.shadowBlur = 14;
      ctx.font = "24px " + PIXEL_UI_FONT;
      ctx.fillText("NJZ don't be blue", canvas.width / 2, 210);

      ctx.font = "24px " + PIXEL_UI_FONT;

      startOptions.forEach((option, index) => {
        const y = 292 + index * 48;
        const isSelected = index === selectedStartOption;
        const isAvailable = option.available !== false;

        ctx.shadowColor =
          isSelected && isAvailable
            ? "#ff7bff"
            : "transparent";
        ctx.shadowBlur = isSelected && isAvailable ? 18 : 0;
        ctx.fillStyle =
          !isAvailable
            ? "rgba(255, 255, 255, 0.28)"
            : isSelected
              ? "#ffffff"
              : "rgba(255, 255, 255, 0.62)";

        const prefix = isSelected ? "> " : "  ";
        const suffix = isSelected ? " <" : "  ";
        ctx.fillText(
          prefix + option.label + suffix,
          canvas.width / 2,
          y
        );
      });

      const blink = 0.55 + Math.sin(performance.now() / 350) * 0.35;
      ctx.shadowColor = "white";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(255, 255, 255, " + blink + ")";
      ctx.font = "20px " + PIXEL_UI_FONT;
      ctx.fillText("按 回车键 确认", canvas.width / 2, 520);

      ctx.restore();
    }
    function drawCharacterSelectScreen() {
      drawBackground();

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "white";
      ctx.font = "44px " + PIXEL_UI_FONT;
      ctx.fillText("角色选择", canvas.width / 2, 130);

      const startX = canvas.width / 2 - 180;
      const y = 285;
      const gap = 90;

      characterImages.forEach((image, index) => {
        const x = startX + index * gap;
        const isSelected = index === previewCharacterIndex;

        ctx.save();

        ctx.shadowColor = isSelected ? "#7deaff" : "transparent";
        ctx.shadowBlur = isSelected ? 18 : 0;
        ctx.strokeStyle = isSelected ? "#dffbff" : "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = isSelected ? 4 : 2;
        ctx.fillStyle = "rgba(35, 0, 60, 0.72)";
        ctx.fillRect(x - 30, y - 34, 60, 68);
        ctx.strokeRect(x - 30, y - 34, 60, 68);

        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
          image,
          0,
          0,
          16,
          16,
          x - 24,
          y - 24,
          48,
          48
        );

        ctx.restore();
      });

      const previewStats =
        characterStats[previewCharacterIndex] ?? characterStats[0];

      ctx.shadowColor = "#7deaff";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(35, 0, 60, 0.78)";
      ctx.strokeStyle = "rgba(223, 251, 255, 0.75)";
      ctx.lineWidth = 2;
      ctx.fillRect(70, 350, 500, 66);
      ctx.strokeRect(70, 350, 500, 66);

      ctx.fillStyle = "#7deaff";
      ctx.font = "16px " + PIXEL_UI_FONT;
      ctx.fillText("角色技能", canvas.width / 2, 368);

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 8;
      ctx.fillStyle = "#ffffff";
      ctx.font = "18px " + PIXEL_UI_FONT;
      ctx.fillText(
        previewStats.skillDescription,
        canvas.width / 2,
        395
      );

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 10;
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.font = "18px " + PIXEL_UI_FONT;
      ctx.fillText("← → 选择　回车键 确认　ESC 返回", canvas.width / 2, 455);

      ctx.restore();
    }

    function isLevelUnlocked(levelIndex) {
      return levelIndex + 1 <= unlockedLevel;
    }

    function isDebugLevelShortcutPressed() {
      const isLPressed = keys.l || keys.L;
      const isQPressed = keys.q || keys.Q;

      return isLPressed && isQPressed;
    }

    function drawLevelSelectScreen() {
      drawBackground();

      const columns = 5;
      const tileWidth = 82;
      const tileHeight = 58;
      const gap = 14;
      const gridWidth = columns * tileWidth + (columns - 1) * gap;
      const startX = (canvas.width - gridWidth) / 2;
      const startY = 166;

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "white";
      ctx.font = "42px " + PIXEL_UI_FONT;
      ctx.fillText(
        debugLevelSelectMode
          ? "选择关卡 [调试]"
          : "选择关卡",
        canvas.width / 2,
        92
      );

      levels.forEach((level, index) => {
