        const col = index % columns;
        const row = Math.floor(index / columns);
        const x = startX + col * (tileWidth + gap);
        const y = startY + row * (tileHeight + gap);
        const isSelected = index === selectedLevelOption;
        const isUnlocked = isLevelUnlocked(index);
        const isSelectable = debugLevelSelectMode || isUnlocked;

        ctx.shadowColor =
          isSelected
            ? isSelectable
              ? "#7deaff"
              : "#76588f"
            : "transparent";
        ctx.shadowBlur = isSelected ? 16 : 0;
        ctx.fillStyle =
          isSelectable
            ? "rgba(55, 10, 88, 0.92)"
            : "rgba(24, 12, 38, 0.82)";
        ctx.fillRect(x, y, tileWidth, tileHeight);

        ctx.strokeStyle =
          isSelected
            ? isSelectable
              ? "#dffbff"
              : "#806895"
            : isSelectable
              ? "#ff77e9"
              : "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = isSelected ? 3 : 2;
        ctx.strokeRect(x, y, tileWidth, tileHeight);

        ctx.shadowBlur = 0;
        ctx.fillStyle =
          isSelectable
            ? "#ffffff"
            : "rgba(255, 255, 255, 0.3)";
        ctx.font = "28px " + PIXEL_UI_FONT;
        ctx.fillText(
          String(level.id).padStart(2, "0"),
          x + tileWidth / 2,
          y + tileHeight / 2
        );

        if (debugLevelSelectMode) {
          ctx.font = "11px " + PIXEL_UI_FONT;
          ctx.fillText("测试", x + tileWidth / 2, y + 46);
        }
      });

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 10;
      ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
      ctx.font = "16px " + PIXEL_UI_FONT;
      ctx.fillText("回车键 开始", canvas.width / 2, 558);
      ctx.fillText("ESC 返回", canvas.width / 2, 584);

      ctx.restore();
    }

    function drawGame() {
      drawBackground();
      drawMazeWalls();
      drawPigHome();
      drawPortals();

      const time = performance.now() / 300;

      stars.forEach((star, index) => {
        if (!star.collected) {
          const sparkle = (Math.sin(time + index) + 1) / 2;
          drawStar(star.x, star.y, star.radius, sparkle);
        }
      });

      enemies.forEach(enemy => {
        drawAlienPig(enemy);
      });

      lasers.forEach(laser => {
        drawLaser(laser);
      });

      if (invincibleTimer <= 0 || Math.floor(invincibleTimer / 6) % 2 === 0) {
        ctx.drawImage(
          characterImages[selectedCharacterIndex],
          currentFrame * 16,
          0,
          16,
          16,
          player.x,
          player.y,
          player.size,
          player.size
        );
      }

      drawHud();
    }

    function drawPauseMenu() {
      drawGame();

      ctx.save();
      ctx.fillStyle = "rgba(13, 0, 30, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(35, 0, 60, 0.92)";
      ctx.shadowColor = "#ff5cf4";
      ctx.shadowBlur = 22;
      ctx.fillRect(160, 200, 320, 240);

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "white";
      ctx.lineWidth = 3;
      ctx.strokeRect(160, 200, 320, 240);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "white";
      ctx.font = "42px monospace";
      ctx.fillText("PAUSED", canvas.width / 2, 250);

      ctx.font = "20px monospace";

      pauseOptions.forEach((option, index) => {
        const y = 300 + index * 54;
        const isSelected = index === selectedPauseOption;

        ctx.shadowColor = isSelected ? "#ff7bff" : "transparent";
        ctx.shadowBlur = isSelected ? 14 : 0;
        ctx.fillStyle = isSelected ? "white" : "rgba(255, 255, 255, 0.64)";

        const prefix = isSelected ? "> " : "  ";
        const suffix = isSelected ? " <" : "  ";
        ctx.fillText(prefix + option + suffix, canvas.width / 2, y);
      });

      ctx.restore();
    }
    function drawHardRulesScreen() {
      drawGame();

      ctx.save();

      ctx.fillStyle = "rgba(8, 0, 18, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(35, 0, 70, 0.94)";
      ctx.shadowColor = "#ff5cf4";
      ctx.shadowBlur = 24;
      ctx.fillRect(96, 220, 448, 200);

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#ff77e9";
      ctx.lineWidth = 4;
      ctx.strokeRect(96, 220, 448, 200);

      ctx.strokeStyle = "#ffd6ff";
      ctx.lineWidth = 2;
      ctx.strokeRect(110, 234, 420, 172);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "white";
      ctx.font = "24px monospace";
      ctx.fillText("按空格键发射激光，消灭猪猪", canvas.width / 2, 292);

      const blink = 0.55 + Math.sin(performance.now() / 350) * 0.35;
      ctx.shadowColor = "#7deaff";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(223, 251, 255, " + blink + ")";
      ctx.font = "20px monospace";
      ctx.fillText("按空格键开始", canvas.width / 2, 356);

      ctx.restore();
    }

    function drawLevelIntroScreen() {
      drawGame();

      const level = levels[currentLevelIndex];

      ctx.save();

      ctx.fillStyle = "rgba(8, 0, 18, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(35, 0, 70, 0.94)";
      ctx.shadowColor = "#ff5cf4";
      ctx.shadowBlur = 24;
      ctx.fillRect(76, 210, 488, 220);

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#ff77e9";
      ctx.lineWidth = 4;
      ctx.strokeRect(76, 210, 488, 220);

      ctx.strokeStyle = "#ffd6ff";
      ctx.lineWidth = 2;
      ctx.strokeRect(90, 224, 460, 192);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "white";
      ctx.font = "30px monospace";
      ctx.fillText("LEVEL " + level.id, canvas.width / 2, 268);

      ctx.shadowBlur = 8;
      ctx.font = "20px monospace";
      ctx.fillText(level.hintText, canvas.width / 2, 326);

      const blink = 0.55 + Math.sin(performance.now() / 350) * 0.35;
      ctx.shadowColor = "#7deaff";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(223, 251, 255, " + blink + ")";
      ctx.font = "18px monospace";
      ctx.fillText("Press Enter to Start", canvas.width / 2, 380);

      ctx.restore();
    }

    function drawOverlayTitle(title, y, instruction = "Press Enter to Restart") {
      ctx.save();
      ctx.fillStyle = "rgba(8, 0, 18, 0.76)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.shadowColor = "#ff7bff";
      ctx.shadowBlur = 24;
      ctx.fillStyle = "white";
      ctx.font = "56px monospace";
      ctx.fillText(title, canvas.width / 2, y);

      const blink = 0.55 + Math.sin(performance.now() / 350) * 0.35;
      ctx.shadowColor = "white";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(255, 255, 255, " + blink + ")";
      ctx.font = "20px monospace";
      ctx.fillText(instruction, canvas.width / 2, y + 80);

      ctx.restore();
    }

    function drawLevelCompleteScreen() {
      drawGame();
      drawOverlayTitle(
        "Level Complete",
        280,
        "Press Enter for Next Level"
      );
      drawHud();
    }

    function drawWinScreen() {
      drawGame();
      drawOverlayTitle("You Win", 280);
      drawHud();
    }

    function drawGameOverScreen() {
      drawGame();
      drawOverlayTitle("GAME OVER", 280);
      drawHud();
    }

    function draw() {
      if (gameState === "start") {
        drawStartScreen();
      } else if (gameState === "levelSelect") {
        drawLevelSelectScreen();
      } else if (gameState === "characterSelect") {
        drawCharacterSelectScreen();
      } else if (gameState === "levelIntro") {
        drawLevelIntroScreen();
      } else if (gameState === "playing") {
        drawGame();
      } else if (gameState === "hardRules") {
        drawHardRulesScreen();
      } else if (gameState === "paused") {
        drawPauseMenu();
      } else if (gameState === "levelComplete") {
        drawLevelCompleteScreen();
      } else if (gameState === "win") {
        drawWinScreen();
      } else if (gameState === "gameOver") {
        drawGameOverScreen();
      }
    }


    function gameLoop(timestamp) {
      updateButtons();

      if (gameState === "playing") {
        updateCountdown(timestamp);

        if (gameState === "playing") {
          update();
        }
      } else {
        lastCountdownTimestamp = null;
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    generateMaze(levels[currentLevelIndex]);
    gameLoop();
  </script>
</body>
</html>
